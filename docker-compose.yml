services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-aesh_user}:${POSTGRES_PASSWORD:-aesh_password}@postgres:5432/${POSTGRES_DB:-aesh_db}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - N8N_BOOKING_WEBHOOK_URL=${N8N_BOOKING_WEBHOOK_URL:-http://n8n:5678/webhook/galala-bus-confirm}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_RUNNERS_ENABLED=true
      - TZ=${TZ:-Africa/Cairo}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --edge-ip-version 4 --protocol http2 --url http://127.0.0.1:3001}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aesh_user
      - POSTGRES_PASSWORD=aesh_password
      - POSTGRES_DB=aesh_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aesh_user -d aesh_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
