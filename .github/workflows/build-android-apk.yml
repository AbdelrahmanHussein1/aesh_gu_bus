name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Make Gradlew Executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Standalone Android Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p dist-apk
          if [ -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist-apk/bus-aesh-v1.0.0.apk
          else
            find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/bus-aesh-v1.0.0.apk \;
          fi
          echo "Built Standalone APK with embedded JS bundle:"
          ls -lh dist-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bus-aesh-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
