name: Build & Publish Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types & Models
        run: npm run build --workspace=packages/shared

      - name: Build Fastify API Backend
        run: npm run build --workspace=apps/api

      - name: Build Next.js Web Frontend
        run: npm run build --workspace=apps/web

      - name: Package Production Distribution Bundle
        run: node scripts/package-release.js

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with Downloadable Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: dist-release/*.zip
          body: |
            ## 🚌 Bus Aesh — Galala University Transport Service
            ### Production Release ${{ steps.vars.outputs.tag }}

            This release package contains the complete, pre-built, production-ready system:
            - **Web Booking Portal**: Next.js 15 SSR & client application with 5-shift scheduling and role switcher.
            - **Fastify API Server**: Real-time seat reservation, atomic transactions, QR pass generation, and administrative hub.
            - **Admin Operations Console**: Shift creation, roster replication (reuse old schedules across dates), and occupancy monitors.
            - **Personnel Directory**: Integrated driver and line supervisor (*مرافقي الخطوط*) profiles with direct contact actions.

            ---

            ### 🚀 Quick Start from Downloaded Package:
            ```bash
            # 1. Unzip the downloaded release archive
            unzip bus-aesh-*.zip -d bus-aesh
            cd bus-aesh

            # 2. Install production dependencies
            npm install --omit=dev

            # 3. Start Fastify API (Port 3000)
            npm run start --workspace=apps/api

            # 4. Start Web Application (Port 3001)
            npm run start --workspace=apps/web
            ```
